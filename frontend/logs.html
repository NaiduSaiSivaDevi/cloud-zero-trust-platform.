<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log Analysis — CloudGuard Zero Trust</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="app-sidebar"></aside>
    <div class="main-wrapper">
      <header class="topbar" id="app-topbar"></header>
      <main class="content-area">
        <div id="page-banner"></div>
        <div id="log-source-banner"></div>

        <section class="card" style="margin-bottom:20px;">
          <div class="form-grid">
            <div class="form-group">
              <label for="l-search">Search Logs</label>
              <input id="l-search" type="text" placeholder="Search user, action, resource..." />
            </div>
            <div class="form-group">
              <label for="l-severity">Severity</label>
              <select id="l-severity">
                <option value="">All</option>
                <option value="Info">Info</option>
                <option value="Warning">Warning</option>
                <option value="High">High</option>
                <option value="Critical">Critical</option>
              </select>
            </div>
            <div class="form-group" style="justify-content:flex-end;">
              <button class="btn btn-primary" id="l-filter-btn" type="button">Apply Filter</button>
            </div>
          </div>
        </section>

        <section class="card">
          <div class="card-header"><h2 class="card-title">Security &amp; Audit Logs</h2></div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Timestamp</th>
                  <th>Event Type</th>
                  <th>User</th>
                  <th>Resource</th>
                  <th>Decision</th>
                  <th>Severity</th>
                  <th>Description</th>
                </tr>
              </thead>
              <tbody id="logs-body">
                <tr><td colspan="7">Loading logs...</td></tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script>
    if (initLayout("Log Analysis", "ELK / Audit Trail")) {
      async function loadLogs() {
        try {
          const qs = new URLSearchParams();
          const search = document.getElementById("l-search").value.trim();
          const sev = document.getElementById("l-severity").value;
          if (search) qs.set("search", search);
          if (sev) qs.set("severity", sev);

          const res = await apiRequest(`/api/logs?${qs.toString()}`);
          document.getElementById("log-source-banner").innerHTML = `
            <div class="banner banner-info">
              <strong>Data Source:</strong> <code>${escapeHtml(res.data_source)}</code> (SQLite audit fallback active when Elasticsearch/Logstash is not configured).
            </div>
          `;

          const tbody = document.getElementById("logs-body");
          tbody.innerHTML = res.items.length ? res.items.map(l => `
            <tr>
              <td>${formatDate(l.timestamp)}</td>
              <td><strong>${escapeHtml(l.event_type)}</strong></td>
              <td>${escapeHtml(l.user)}</td>
              <td><code>${escapeHtml(l.resource)}</code></td>
              <td><span class="pill pill-${(l.decision || 'neutral').toLowerCase()}">${escapeHtml(l.decision)}</span></td>
              <td><span class="pill pill-${l.severity.toLowerCase()}">${escapeHtml(l.severity)}</span></td>
              <td>${escapeHtml(l.description)}</td>
            </tr>
          `).join("") : `<tr><td colspan="7">No matching log entries found.</td></tr>`;
        } catch (err) {
          showBanner("page-banner", err.message, "error");
        }
      }

      document.getElementById("l-filter-btn").addEventListener("click", loadLogs);
      loadLogs();
    }
  </script>
</body>
</html>
