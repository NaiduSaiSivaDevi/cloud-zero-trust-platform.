<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — CloudGuard Zero Trust</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <main style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;">
    <section class="card" style="width:min(100%,420px);">
      <div class="card-header">
        <div>
          <h1 class="card-title">CloudGuard Zero Trust</h1>
          <p style="color:var(--text-secondary);margin-top:6px;">Sign in to your security workspace.</p>
        </div>
      </div>
      <form id="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </div>
        <p id="login-error" class="banner banner-error" role="alert" hidden></p>
        <button id="login-submit" class="btn btn-primary" type="submit" style="width:100%;">Sign in</button>
      </form>
    </section>
  </main>
  <script src="js/api.js"></script>
  <script>
    const form = document.getElementById("login-form");
    const errorBanner = document.getElementById("login-error");
    const submitButton = document.getElementById("login-submit");
    const allowedPages = new Set([
      "dashboard.html", "providers.html", "scanner.html", "findings.html",
      "policies.html", "optimization.html", "monitoring.html", "logs.html",
      "reports.html", "users.html",
    ]);

    function getNextUrl() {
      const requested = new URLSearchParams(window.location.search).get("next");
      const fallback = new URL("dashboard.html", window.location.href);
      if (!requested) return fallback;

      const target = new URL(requested, window.location.href);
      const page = target.pathname.split("/").pop();
      return target.origin === window.location.origin && allowedPages.has(page)
        ? target
        : fallback;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      errorBanner.hidden = true;
      submitButton.disabled = true;
      try {
        const result = await apiRequest("/api/auth/login", {
          method: "POST",
          body: JSON.stringify({
            email: document.getElementById("email").value,
            password: document.getElementById("password").value,
          }),
        });
        setSession(result.access_token, result.user);
        window.location.replace(getNextUrl().href);
      } catch (error) {
        errorBanner.textContent = error.message;
        errorBanner.hidden = false;
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
