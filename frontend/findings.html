<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Security Findings — CloudGuard Zero Trust</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="app-sidebar"></aside>
    <div class="main-wrapper">
      <header class="topbar" id="app-topbar"></header>
      <main class="content-area">
        <div id="page-banner"></div>

        <section class="card" style="margin-bottom:20px;">
          <div class="form-grid">
            <div class="form-group">
              <label for="f-search">Search Resource / Issue</label>
              <input id="f-search" type="text" placeholder="Filter by resource or title..." />
            </div>
            <div class="form-group">
              <label for="f-severity">Severity</label>
              <select id="f-severity">
                <option value="">All Severities</option>
                <option value="Critical">Critical</option>
                <option value="High">High</option>
                <option value="Medium">Medium</option>
                <option value="Low">Low</option>
              </select>
            </div>
            <div class="form-group">
              <label for="f-provider">Provider</label>
              <select id="f-provider">
                <option value="">All Providers</option>
                <option value="AWS">AWS</option>
                <option value="Azure">Azure</option>
                <option value="GCP">GCP</option>
              </select>
            </div>
            <div class="form-group">
              <label for="f-status">Status</label>
              <select id="f-status">
                <option value="">All Statuses</option>
                <option value="open">Open</option>
                <option value="reviewed">Reviewed</option>
                <option value="resolved">Resolved</option>
              </select>
            </div>
          </div>
        </section>

        <section class="card">
          <div class="card-header"><h2 class="card-title">Detected Misconfigurations</h2></div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Provider</th>
                  <th>Resource</th>
                  <th>Issue &amp; Recommendation</th>
                  <th>Severity</th>
                  <th>Status</th>
                  <th>Detected</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="findings-body">
                <tr><td colspan="8">Loading findings...</td></tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script>
    if (initLayout("Security Findings", "Misconfigurations")) {
      let allFindings = [];

      async function loadFindings() {
        try {
          const sev = document.getElementById("f-severity").value;
          const prov = document.getElementById("f-provider").value;
          const st = document.getElementById("f-status").value;
          const qs = new URLSearchParams();
          if (sev) qs.set("severity", sev);
          if (prov) qs.set("provider", prov);
          if (st) qs.set("status_filter", st);
          allFindings = await apiRequest(`/api/findings?${qs.toString()}`);
          renderFindings();
        } catch (err) {
          showBanner("page-banner", err.message, "error");
        }
      }

      function renderFindings() {
        const q = document.getElementById("f-search").value.trim().toLowerCase();
        const rows = allFindings.filter(f =>
          !q || f.resource.toLowerCase().includes(q) || f.title.toLowerCase().includes(q) || f.description.toLowerCase().includes(q)
        );
        const tbody = document.getElementById("findings-body");
        if (!rows.length) {
          tbody.innerHTML = `<tr><td colspan="8">No findings match the selected filters. Run a scan in Config Scanner to populate findings.</td></tr>`;
          return;
        }
        tbody.innerHTML = rows.map(f => `
          <tr>
            <td>#${f.id}</td>
            <td>${escapeHtml(f.provider)}</td>
            <td><code>${escapeHtml(f.resource)}</code></td>
            <td>
              <strong>${escapeHtml(f.title)}</strong><br />
              <span style="color:#64748B;font-size:12px;">${escapeHtml(f.description)}</span><br />
              <span style="color:#059669;font-size:12px;">Fix: ${escapeHtml(f.recommendation)}</span>
            </td>
            <td><span class="pill pill-${f.severity.toLowerCase()}">${escapeHtml(f.severity)}</span></td>
            <td><span class="pill pill-${f.status}">${escapeHtml(f.status)}</span></td>
            <td>${formatDate(f.detected_at)}</td>
            <td style="white-space:nowrap;">
              <button class="btn btn-secondary btn-sm" onclick="setStatus(${f.id}, 'reviewed')">Review</button>
              <button class="btn btn-primary btn-sm" onclick="setStatus(${f.id}, 'resolved')">Resolve</button>
            </td>
          </tr>
        `).join("");
      }

      window.setStatus = async (id, status) => {
        try {
          await apiRequest(`/api/findings/${id}/status`, {
            method: "PUT",
            body: JSON.stringify({ status }),
          });
          loadFindings();
        } catch (err) {
          showBanner("page-banner", err.message, "error");
        }
      };

      ["f-severity", "f-provider", "f-status"].forEach(id =>
        document.getElementById(id).addEventListener("change", loadFindings)
      );
      document.getElementById("f-search").addEventListener("input", renderFindings);
      loadFindings();
    }
  </script>
</body>
</html>
