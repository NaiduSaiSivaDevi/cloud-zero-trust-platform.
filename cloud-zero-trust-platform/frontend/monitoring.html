<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monitoring — CloudGuard Zero Trust</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="app-sidebar"></aside>
    <div class="main-wrapper">
      <header class="topbar" id="app-topbar"></header>
      <main class="content-area">
        <div id="page-banner"></div>
        <div id="prom-status-banner"></div>

        <section class="grid-4">
          <div class="card"><div class="kpi-label">API Health</div><div class="kpi-value" id="m-health">-</div><div class="kpi-sub" id="m-uptime">Uptime: -</div></div>
          <div class="card"><div class="kpi-label">CPU / Memory</div><div class="kpi-value" id="m-cpu">-</div><div class="kpi-sub" id="m-mem">Memory: -</div></div>
          <div class="card"><div class="kpi-label">Avg Scan Time</div><div class="kpi-value" id="m-scan">-</div><div class="kpi-sub" id="m-scan-count">- scans</div></div>
          <div class="card"><div class="kpi-label">Avg Policy Latency</div><div class="kpi-value" id="m-policy">-</div><div class="kpi-sub" id="m-policy-count">- evaluations</div></div>
        </section>

        <section class="card">
          <div class="card-header">
            <h2 class="card-title">System &amp; Integration Status</h2>
            <button class="btn btn-secondary btn-sm" id="refresh-mon" type="button">Refresh Metrics</button>
          </div>
          <div class="table-wrap">
            <table>
              <tbody id="mon-details"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script>
    if (initLayout("Live Monitoring", "Prometheus & Application Health")) {
      async function loadMetrics() {
        try {
          const [health, metrics] = await Promise.all([
            apiRequest("/api/monitoring/health"),
            apiRequest("/api/monitoring/metrics"),
          ]);

          document.getElementById("prom-status-banner").innerHTML = health.prometheus_configured
            ? `<div class="banner banner-success">Prometheus connected.</div>`
            : `<div class="banner banner-warning"><strong>Prometheus Not Configured:</strong> Displaying real local FastAPI &amp; SQLite application metrics instead of invented Prometheus streams.</div>`;

          document.getElementById("m-health").textContent = health.status.toUpperCase();
          document.getElementById("m-uptime").textContent = `Uptime: ${metrics.uptime_seconds}s`;
          document.getElementById("m-cpu").textContent = metrics.cpu_usage_pct !== null ? `${metrics.cpu_usage_pct}%` : "N/A";
          document.getElementById("m-mem").textContent = metrics.memory_usage_pct !== null ? `Memory: ${metrics.memory_usage_pct}%` : "psutil not installed";
          document.getElementById("m-scan").textContent = `${metrics.avg_scan_execution_ms} ms`;
          document.getElementById("m-scan-count").textContent = `${metrics.total_scans} total scans`;
          document.getElementById("m-policy").textContent = `${metrics.avg_policy_evaluation_ms} ms`;
          document.getElementById("m-policy-count").textContent = `${metrics.total_policy_evaluations} evaluations`;

          document.getElementById("mon-details").innerHTML = `
            <tr><th>Database</th><td>${escapeHtml(health.database)}</td></tr>
            <tr><th>Prometheus Status</th><td>${escapeHtml(health.prometheus_status)}</td></tr>
            <tr><th>ELK Stack Status</th><td>${escapeHtml(health.elk_status)}</td></tr>
            <tr><th>Python Runtime</th><td>${escapeHtml(metrics.python_version)}</td></tr>
            <tr><th>Failed Auth Attempts</th><td>${metrics.failed_auth_count}</td></tr>
            <tr><th>Metrics Source</th><td><code>${escapeHtml(metrics.data_source)}</code></td></tr>
          `;
        } catch (err) {
          showBanner("page-banner", err.message, "error");
        }
      }

      document.getElementById("refresh-mon").addEventListener("click", loadMetrics);
      loadMetrics();
    }
  </script>
</body>
</html>
