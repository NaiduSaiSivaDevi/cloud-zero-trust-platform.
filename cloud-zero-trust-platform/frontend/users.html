<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Management — CloudGuard Zero Trust</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="app-sidebar"></aside>
    <div class="main-wrapper">
      <header class="topbar" id="app-topbar"></header>
      <main class="content-area">
        <div id="page-banner"></div>

        <section class="card" style="margin-bottom:20px;">
          <div class="card-header"><h2 class="card-title">Create User (Administrator Only)</h2></div>
          <form id="user-form" class="form-grid">
            <div class="form-group">
              <label for="u-name">Full Name</label>
              <input id="u-name" type="text" required placeholder="Alex Security" />
            </div>
            <div class="form-group">
              <label for="u-email">Email</label>
              <input id="u-email" type="email" required placeholder="alex@cloudguard.io" />
            </div>
            <div class="form-group">
              <label for="u-pwd">Password</label>
              <input id="u-pwd" type="password" minlength="6" required placeholder="Min 6 chars" />
            </div>
            <div class="form-group">
              <label for="u-role">Role</label>
              <select id="u-role">
                <option value="analyst">analyst</option>
                <option value="admin">admin</option>
                <option value="viewer">viewer</option>
              </select>
            </div>
            <div class="form-group" style="justify-content:flex-end;">
              <button type="submit" class="btn btn-primary">Create User</button>
            </div>
          </form>
        </section>

        <section class="card">
          <div class="card-header"><h2 class="card-title">Platform Users</h2></div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Role</th>
                  <th>Status</th>
                  <th>Created</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="users-body">
                <tr><td colspan="7">Loading users...</td></tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script>
    if (initLayout("User Management", "RBAC & Accounts")) {
      async function loadUsers() {
        try {
          const users = await apiRequest("/api/users");
          document.getElementById("users-body").innerHTML = users.map(u => `
            <tr>
              <td>#${u.id}</td>
              <td>${escapeHtml(u.full_name)}</td>
              <td>${escapeHtml(u.email)}</td>
              <td><span class="pill pill-info">${escapeHtml(u.role)}</span></td>
              <td><span class="pill pill-${u.is_active ? 'allow' : 'deny'}">${u.is_active ? 'Active' : 'Inactive'}</span></td>
              <td>${formatDate(u.created_at)}</td>
              <td style="white-space:nowrap;">
                <button class="btn btn-secondary btn-sm" onclick="toggleActive(${u.id}, ${!u.is_active})">
                  ${u.is_active ? 'Deactivate' : 'Activate'}
                </button>
                <button class="btn btn-danger btn-sm" onclick="deleteUser(${u.id})">Delete</button>
              </td>
            </tr>
          `).join("");
        } catch (err) {
          showBanner("page-banner", err.message, "error");
          document.getElementById("users-body").innerHTML = `<tr><td colspan="7">${escapeHtml(err.message)}</td></tr>`;
        }
      }

      document.getElementById("user-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        try {
          await apiRequest("/api/users", {
            method: "POST",
            body: JSON.stringify({
              full_name: document.getElementById("u-name").value.trim(),
              email: document.getElementById("u-email").value.trim(),
              password: document.getElementById("u-pwd").value,
              role: document.getElementById("u-role").value,
            }),
          });
          e.target.reset();
          showBanner("page-banner", "User created.", "success");
          loadUsers();
        } catch (err) {
          showBanner("page-banner", err.message, "error");
        }
      });

      window.toggleActive = async (id, is_active) => {
        try {
          await apiRequest(`/api/users/${id}`, {
            method: "PUT",
            body: JSON.stringify({ is_active }),
          });
          loadUsers();
        } catch (err) {
          showBanner("page-banner", err.message, "error");
        }
      };

      window.deleteUser = async (id) => {
        if (!confirm("Delete this user?")) return;
        try {
          await apiRequest(`/api/users/${id}`, { method: "DELETE" });
          loadUsers();
        } catch (err) {
          showBanner("page-banner", err.message, "error");
        }
      };

      loadUsers();
    }
  </script>
</body>
</html>
