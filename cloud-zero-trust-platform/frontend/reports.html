<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reports — CloudGuard Zero Trust</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="app-sidebar"></aside>
    <div class="main-wrapper">
      <header class="topbar" id="app-topbar"></header>
      <main class="content-area">
        <div id="page-banner"></div>

        <section class="card" style="margin-bottom:20px;">
          <div class="card-header"><h2 class="card-title">Generate Downloadable Security Report</h2></div>
          <form id="report-form" class="form-grid">
            <div class="form-group">
              <label for="r-type">Report Type</label>
              <select id="r-type">
                <option value="findings">Security Findings Report</option>
                <option value="scan">Cloud Scan Report</option>
                <option value="zero_trust">Zero Trust Decision Report</option>
                <option value="optimization">Policy Optimization Report</option>
                <option value="audit">Audit Log Report</option>
              </select>
            </div>
            <div class="form-group">
              <label for="r-format">File Format</label>
              <select id="r-format">
                <option value="pdf">PDF (.pdf)</option>
                <option value="csv">CSV (.csv)</option>
              </select>
            </div>
            <div class="form-group" style="justify-content:flex-end;">
              <button type="submit" class="btn btn-primary">Generate &amp; Save Report</button>
            </div>
          </form>
        </section>

        <section class="card">
          <div class="card-header"><h2 class="card-title">Generated Reports History</h2></div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Title</th>
                  <th>Type</th>
                  <th>Format</th>
                  <th>Generated By</th>
                  <th>Created</th>
                  <th>Download</th>
                </tr>
              </thead>
              <tbody id="reports-body">
                <tr><td colspan="7">Loading reports...</td></tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script>
    if (initLayout("Reports", "PDF & CSV Exports")) {
      async function loadReports() {
        try {
          const reports = await apiRequest("/api/reports");
          const tbody = document.getElementById("reports-body");
          tbody.innerHTML = reports.length ? reports.map(r => `
            <tr>
              <td>#${r.id}</td>
              <td><strong>${escapeHtml(r.title)}</strong></td>
              <td>${escapeHtml(r.report_type)}</td>
              <td><span class="pill pill-info">${escapeHtml(r.format.toUpperCase())}</span></td>
              <td>${escapeHtml(r.generated_by)}</td>
              <td>${formatDate(r.created_at)}</td>
              <td>
                <button class="btn btn-primary btn-sm" onclick="handleDownload(${r.id}, '${escapeHtml(r.report_type)}.${escapeHtml(r.format)}')">
                  Download ${escapeHtml(r.format.toUpperCase())}
                </button>
              </td>
            </tr>
          `).join("") : `<tr><td colspan="7">No reports generated yet.</td></tr>`;
        } catch (err) {
          showBanner("page-banner", err.message, "error");
        }
      }

      window.handleDownload = async (id, name) => {
        try {
          await downloadReportFile(id, name);
        } catch (err) {
          showBanner("page-banner", err.message, "error");
        }
      };

      document.getElementById("report-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        try {
          const rec = await apiRequest("/api/reports/generate", {
            method: "POST",
            body: JSON.stringify({
              report_type: document.getElementById("r-type").value,
              format: document.getElementById("r-format").value,
            }),
          });
          showBanner("page-banner", `Report '${rec.title}' generated and ready for download.`, "success");
          loadReports();
        } catch (err) {
          showBanner("page-banner", err.message, "error");
        }
      });

      loadReports();
    }
  </script>
</body>
</html>
