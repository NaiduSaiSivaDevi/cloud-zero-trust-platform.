<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zero Trust Engine — CloudGuard</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="app-sidebar"></aside>
    <div class="main-wrapper">
      <header class="topbar" id="app-topbar"></header>
      <main class="content-area">
        <div id="page-banner"></div>

        <section class="grid-2">
          <div class="card">
            <div class="card-header"><h2 class="card-title">Evaluate Zero-Trust Access Request</h2></div>
            <form id="eval-form">
              <div class="form-grid">
                <div class="form-group">
                  <label for="ev-identity">User Identity</label>
                  <input id="ev-identity" type="text" required value="analyst@cloudguard.io" />
                </div>
                <div class="form-group">
                  <label for="ev-role">User Role</label>
                  <select id="ev-role">
                    <option value="analyst">analyst</option>
                    <option value="admin">admin</option>
                    <option value="developer">developer</option>
                    <option value="viewer">viewer</option>
                  </select>
                </div>
                <div class="form-group">
                  <label for="ev-auth">Authentication Status</label>
                  <select id="ev-auth">
                    <option value="mfa_verified">mfa_verified</option>
                    <option value="password_only">password_only</option>
                    <option value="unauthenticated">unauthenticated</option>
                  </select>
                </div>
                <div class="form-group">
                  <label for="ev-resource">Requested Resource</label>
                  <input id="ev-resource" type="text" required value="s3://prod-finance-ledger" />
                </div>
                <div class="form-group">
                  <label for="ev-action">Requested Action</label>
                  <select id="ev-action">
                    <option value="read">read</option>
                    <option value="write">write</option>
                    <option value="delete">delete</option>
                    <option value="admin">admin</option>
                  </select>
                </div>
                <div class="form-group">
                  <label for="ev-perms">Assigned Permissions</label>
                  <input id="ev-perms" type="text" required value="read,write" />
                </div>
                <div class="form-group">
                  <label for="ev-sens">Resource Sensitivity</label>
                  <select id="ev-sens">
                    <option value="public">public</option>
                    <option value="internal">internal</option>
                    <option value="confidential">confidential</option>
                    <option value="restricted">restricted</option>
                  </select>
                </div>
              </div>
              <button type="submit" class="btn btn-primary" style="margin-top:8px;">Evaluate Access</button>
            </form>

            <div id="eval-result" style="margin-top:16px;"></div>
          </div>

          <div class="card">
            <div class="card-header"><h2 class="card-title">Create Zero-Trust Policy</h2></div>
            <form id="policy-form">
              <div class="form-group">
                <label for="pol-name">Policy Name</label>
                <input id="pol-name" type="text" required placeholder="ZT-Custom-Write-Guard" />
              </div>
              <div class="form-group">
                <label for="pol-desc">Description</label>
                <input id="pol-desc" type="text" required placeholder="Require review on confidential writes" />
              </div>
              <div class="form-group">
                <label for="pol-cond">Rule Condition</label>
                <input id="pol-cond" type="text" required placeholder="sensitivity == confidential AND action == write" />
              </div>
              <div class="form-grid">
                <div class="form-group">
                  <label for="pol-effect">Effect</label>
                  <select id="pol-effect">
                    <option value="DENY">DENY</option>
                    <option value="REVIEW">REVIEW</option>
                    <option value="ALLOW">ALLOW</option>
                  </select>
                </div>
                <div class="form-group">
                  <label for="pol-prio">Priority</label>
                  <input id="pol-prio" type="number" value="50" />
                </div>
              </div>
              <button type="submit" class="btn btn-primary">Save Policy</button>
            </form>
          </div>
        </section>

        <section class="card" style="margin-bottom:20px;">
          <div class="card-header"><h2 class="card-title">Active Zero-Trust Policies</h2></div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Effect</th>
                  <th>Condition</th>
                  <th>Priority</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="policies-body"></tbody>
            </table>
          </div>
        </section>

        <section class="card">
          <div class="card-header"><h2 class="card-title">Recent Access Decisions (Database)</h2></div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Time</th>
                  <th>Identity</th>
                  <th>Role / Auth</th>
                  <th>Resource (Sensitivity)</th>
                  <th>Action</th>
                  <th>Decision</th>
                  <th>Policy &amp; Reason</th>
                </tr>
              </thead>
              <tbody id="decisions-body"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script>
    if (initLayout("Zero Trust Engine", "Policy Enforcement")) {
      async function loadAll() {
        try {
          const [policies, decisions] = await Promise.all([
            apiRequest("/api/zero-trust/policies"),
            apiRequest("/api/zero-trust/decisions"),
          ]);

          document.getElementById("policies-body").innerHTML = policies.map(p => `
            <tr>
              <td><strong>${escapeHtml(p.name)}</strong> ${p.is_mandatory ? '<span class="pill pill-info">Mandatory</span>' : ''}</td>
              <td><span class="pill pill-${p.effect.toLowerCase()}">${escapeHtml(p.effect)}</span></td>
              <td><code>${escapeHtml(p.rule_condition)}</code></td>
              <td>${p.priority}</td>
              <td><span class="pill pill-${p.is_active ? 'allow' : 'neutral'}">${p.is_active ? 'Active' : 'Inactive'}</span></td>
              <td>
                ${p.is_mandatory ? '<span style="color:#64748B;font-size:12px;">Locked</span>' :
                  `<button class="btn btn-secondary btn-sm" onclick="togglePolicy(${p.id}, ${!p.is_active})">${p.is_active ? 'Deactivate' : 'Activate'}</button>
                   <button class="btn btn-danger btn-sm" onclick="deletePolicy(${p.id})">Delete</button>`}
              </td>
            </tr>
          `).join("");

          document.getElementById("decisions-body").innerHTML = decisions.length ? decisions.map(d => `
            <tr>
              <td>${formatDate(d.created_at)}</td>
              <td>${escapeHtml(d.user_identity)}</td>
              <td>${escapeHtml(d.user_role)} / ${escapeHtml(d.auth_status)}</td>
              <td><code>${escapeHtml(d.resource)}</code> (${escapeHtml(d.resource_sensitivity)})</td>
              <td>${escapeHtml(d.action)}</td>
              <td><span class="pill pill-${d.decision.toLowerCase()}">${escapeHtml(d.decision)}</span></td>
              <td><strong>${escapeHtml(d.policy_name)}</strong>: ${escapeHtml(d.reason)}</td>
            </tr>
          `).join("") : `<tr><td colspan="7">No access evaluations recorded yet.</td></tr>`;
        } catch (err) {
          showBanner("page-banner", err.message, "error");
        }
      }

      document.getElementById("eval-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        try {
          const res = await apiRequest("/api/zero-trust/evaluate", {
            method: "POST",
            body: JSON.stringify({
              user_identity: document.getElementById("ev-identity").value.trim(),
              user_role: document.getElementById("ev-role").value,
              auth_status: document.getElementById("ev-auth").value,
              resource: document.getElementById("ev-resource").value.trim(),
              action: document.getElementById("ev-action").value,
              assigned_permissions: document.getElementById("ev-perms").value.trim(),
              resource_sensitivity: document.getElementById("ev-sens").value,
            }),
          });
          const cls = res.decision === "ALLOW" ? "success" : res.decision === "DENY" ? "error" : "warning";
          document.getElementById("eval-result").innerHTML = `
            <div class="banner banner-${cls}">
              <strong>Decision: ${escapeHtml(res.decision)}</strong> (${res.latency_ms} ms)<br />
              <strong>Policy:</strong> ${escapeHtml(res.policy_name)}<br />
              <strong>Reason:</strong> ${escapeHtml(res.reason)}<br />
              <strong>Checks:</strong> <code>${escapeHtml(res.conditions_checked)}</code>
            </div>
          `;
          loadAll();
        } catch (err) {
          showBanner("page-banner", err.message, "error");
        }
      });

      document.getElementById("policy-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        try {
          await apiRequest("/api/zero-trust/policies", {
            method: "POST",
            body: JSON.stringify({
              name: document.getElementById("pol-name").value.trim(),
              description: document.getElementById("pol-desc").value.trim(),
              rule_condition: document.getElementById("pol-cond").value.trim(),
              effect: document.getElementById("pol-effect").value,
              priority: Number(document.getElementById("pol-prio").value),
            }),
          });
          e.target.reset();
          showBanner("page-banner", "Policy created.", "success");
          loadAll();
        } catch (err) {
          showBanner("page-banner", err.message, "error");
        }
      });

      window.togglePolicy = async (id, is_active) => {
        try {
          await apiRequest(`/api/zero-trust/policies/${id}`, {
            method: "PUT",
            body: JSON.stringify({ is_active }),
          });
          loadAll();
        } catch (err) {
          showBanner("page-banner", err.message, "error");
        }
      };

      window.deletePolicy = async (id) => {
        try {
          await apiRequest(`/api/zero-trust/policies/${id}`, { method: "DELETE" });
          loadAll();
        } catch (err) {
          showBanner("page-banner", err.message, "error");
        }
      };

      loadAll();
    }
  </script>
</body>
</html>
