<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Configuration Scanner — CloudGuard Zero Trust</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="app-sidebar"></aside>
    <div class="main-wrapper">
      <header class="topbar" id="app-topbar"></header>
      <main class="content-area">
        <div id="page-banner"></div>

        <section class="card" style="margin-bottom:20px;">
          <div class="card-header">
            <h2 class="card-title">Run Cloud Configuration Scan (DEMO MODE)</h2>
            <span class="pill pill-demo">6 Detection Rules Active</span>
          </div>
          <form id="scan-form" class="form-grid">
            <div class="form-group">
              <label for="scan-provider">Cloud Provider</label>
              <select id="scan-provider" required></select>
            </div>
            <div class="form-group">
              <label for="scan-env">Environment</label>
              <select id="scan-env">
                <option value="production">production</option>
                <option value="staging">staging</option>
              </select>
            </div>
            <div class="form-group" style="justify-content:flex-end;">
              <button type="submit" class="btn btn-primary" id="start-scan-btn">Start Scan</button>
            </div>
          </form>
          <div id="latest-scan-result" style="margin-top:12px;"></div>
        </section>

        <section class="card">
          <div class="card-header"><h2 class="card-title">Scan Execution History</h2></div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Scan ID</th>
                  <th>Provider ID</th>
                  <th>Environment</th>
                  <th>Resources</th>
                  <th>Findings</th>
                  <th>Critical / High</th>
                  <th>Duration</th>
                  <th>Completed</th>
                </tr>
              </thead>
              <tbody id="scans-body">
                <tr><td colspan="8">Loading scans...</td></tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script>
    if (initLayout("Configuration Scanner", "Misconfiguration Detection")) {
      const params = new URLSearchParams(window.location.search);
      const preselectedProvider = params.get("provider_id");

      async function loadData() {
        try {
          const [providers, scans] = await Promise.all([
            apiRequest("/api/providers"),
            apiRequest("/api/scans"),
          ]);
          const select = document.getElementById("scan-provider");
          select.innerHTML = providers.map(p =>
            `<option value="${p.id}" ${preselectedProvider == p.id ? "selected" : ""}>${escapeHtml(p.name)} (${escapeHtml(p.status)})</option>`
          ).join("");

          const tbody = document.getElementById("scans-body");
          if (!scans.length) {
            tbody.innerHTML = `<tr><td colspan="8">No scans run yet. Start your first scan above.</td></tr>`;
          } else {
            tbody.innerHTML = scans.map(s => `
              <tr>
                <td>#${s.id}</td>
                <td>Provider #${s.provider_id}</td>
                <td>${escapeHtml(s.environment)}</td>
                <td>${s.total_resources}</td>
                <td><strong>${s.total_findings}</strong></td>
                <td><span class="pill pill-critical">${s.critical_count} Crit</span> <span class="pill pill-high">${s.high_count} High</span></td>
                <td>${s.duration_ms} ms</td>
                <td>${formatDate(s.completed_at)}</td>
              </tr>
            `).join("");
          }
        } catch (err) {
          showBanner("page-banner", err.message, "error");
        }
      }

      document.getElementById("scan-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = document.getElementById("start-scan-btn");
        btn.disabled = true;
        btn.textContent = "Scanning...";
        try {
          const scan = await apiRequest("/api/scans", {
            method: "POST",
            body: JSON.stringify({
              provider_id: Number(document.getElementById("scan-provider").value),
              environment: document.getElementById("scan-env").value,
            }),
          });
          document.getElementById("latest-scan-result").innerHTML = `
            <div class="banner banner-success">
              Scan #${scan.id} completed in ${scan.duration_ms} ms — Scanned <strong>${scan.total_resources}</strong> resources, detected <strong>${scan.total_findings}</strong> misconfigurations (${scan.critical_count} Critical, ${scan.high_count} High, ${scan.medium_count} Medium).
              <a href="findings.html" style="text-decoration:underline;margin-left:8px;">View Findings &rarr;</a>
            </div>
          `;
          loadData();
        } catch (err) {
          showBanner("page-banner", err.message, "error");
        } finally {
          btn.disabled = false;
          btn.textContent = "Start Scan";
        }
      });

      loadData();
    }
  </script>
</body>
</html>
